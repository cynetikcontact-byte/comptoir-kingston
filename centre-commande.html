<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Centre de commande — KINGSTON</title>
<style>
  :root{
    --bg:#13110c; --panel:#1c1810; --panel2:#241f15; --line:#332b1c;
    --cream:#f1ead8; --muted:#9a917c; --gold:#d8b252; --gold2:#e7c873;
    --new:#e0a93b; --prep:#4ea3d8; --done:#5bbd7a; --serif:"Georgia","Times New Roman",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
  header{display:flex;align-items:center;gap:18px;padding:14px 22px;background:linear-gradient(180deg,#1d1810,#15110b);border-bottom:1px solid var(--line)}
  .brand{font-family:var(--serif);font-weight:700;letter-spacing:.14em;font-size:20px;color:var(--gold)}
  .brand small{display:block;font-size:9px;letter-spacing:.34em;color:var(--muted);font-weight:400}
  .htitle{font-size:14px;color:var(--muted)}
  .htitle b{color:var(--cream);font-size:16px}
  select{background:var(--panel2);color:var(--cream);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px}
  .spacer{flex:1}
  .pending{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px}
  .pending b{font-family:var(--serif);font-size:18px;color:var(--new)}
  .dot{width:9px;height:9px;border-radius:50%;background:#7a6a3c}
  .dot.on{background:var(--done);box-shadow:0 0 8px var(--done)}
  .dot.off{background:#c0594a}
  .btn{background:var(--gold);color:#231a06;border:none;border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--line)}
  .activate-banner{display:flex;align-items:center;justify-content:center;gap:14px;background:#2a2113;border-bottom:1px solid var(--line);padding:10px;font-size:13px;color:var(--gold2)}
  .board{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;height:calc(100% - 64px)}
  .col{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0}
  .col:last-child{border-right:none}
  .col-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
  .col-h .cnt{font-family:var(--serif);font-size:15px;color:var(--cream)}
  .col.new .col-h{color:var(--new)} .col.prep .col-h{color:var(--prep)} .col.done .col-h{color:var(--done)}
  .col-b{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--new);border-radius:13px;padding:13px 14px;animation:none}
  .col.prep .card{border-left-color:var(--prep)} .col.done .card{border-left-color:var(--done)}
  .card.flash{animation:flash 1.1s ease-out 3}
  @keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(224,169,59,0)}40%{box-shadow:0 0 0 3px rgba(224,169,59,.55)}}
  .card-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
  .num{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--cream)}
  .meta{font-size:11px;color:var(--muted);text-align:right;line-height:1.5}
  .meta .borne{color:var(--gold2);font-weight:700}
  .items{display:flex;flex-direction:column;gap:5px;margin:8px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:9px 0}
  .it{font-size:14px;display:flex;gap:7px}
  .it .q{color:var(--gold2);font-weight:700;min-width:26px}
  .it .d{color:var(--muted)}
  .card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
  .tot{font-family:var(--serif);font-size:16px}
  .who{font-size:11px;color:var(--muted);margin-top:2px}
  .act{border:none;border-radius:9px;padding:9px 13px;font-weight:700;font-size:13px;cursor:pointer;color:#231a06}
  .act.new{background:var(--new)} .act.prep{background:var(--prep)} .act.done{background:var(--done)}
  .empty{color:#6b6450;font-size:13px;text-align:center;padding:30px 10px;font-style:italic}
  .col-b::-webkit-scrollbar{width:9px}.col-b::-webkit-scrollbar-thumb{background:#2e2718;border-radius:5px}
</style>
</head>
<body>
  <header>
    <div class="brand">KINGSTON<small>CENTRE DE COMMANDE</small></div>
    <div class="htitle">Atelier · <b id="bname">—</b></div>
    <select id="bsel" title="Changer de boutique">
      <option value="aix">Aix-en-Provence</option>
      <option value="marseille">Marseille Prado</option>
      <option value="avignon">Avignon Centre</option>
    </select>
    <div class="spacer"></div>
    <div class="pending"><span>En attente</span><b id="pend">0</b></div>
    <div class="pending"><span class="dot" id="live"></span><span id="livetxt">Connexion…</span></div>
    <button class="btn" id="act-btn">🔔 Activer son + alertes</button>
  </header>
  <div class="activate-banner" id="banner">Clique sur « Activer son + alertes » pour autoriser le bip sonore et les notifications système (une fois par session).</div>
  <div class="board">
    <div class="col new"><div class="col-h"><span>Nouveau</span><span class="cnt" id="c-new">0</span></div><div class="col-b" id="col-nouveau"></div></div>
    <div class="col prep"><div class="col-h"><span>En préparation</span><span class="cnt" id="c-prep">0</span></div><div class="col-b" id="col-preparation"></div></div>
    <div class="col done"><div class="col-h"><span>Prête</span><span class="cnt" id="c-done">0</span></div><div class="col-b" id="col-prete"></div></div>
  </div>

<script>
(function(){
  var BNAMES={aix:'Aix-en-Provence', marseille:'Marseille Prado', avignon:'Avignon Centre'};
  var QP=new URLSearchParams(location.search);
  var BOUTIQUE=QP.get('boutique')||'aix';
  document.getElementById('bname').textContent=BNAMES[BOUTIQUE]||BOUTIQUE;
  var bsel=document.getElementById('bsel'); bsel.value=BOUTIQUE;
  bsel.addEventListener('change',function(){ location.search='?boutique='+encodeURIComponent(bsel.value); });

  var ordersMap={};
  var flashIds={};
  var audioCtx=null, soundOn=false;

  function esc(s){return (''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
  function eur(n){return (Number(n)||0).toFixed(2).replace('.',',')+' €';}
  function ago(ts){var m=Math.floor((Date.now()-ts)/60000); if(m<1)return 'à l’instant'; if(m===1)return 'il y a 1 min'; return 'il y a '+m+' min';}

  // ---- Alertes ----
  function beep(){
    if(!soundOn||!audioCtx)return;
    try{
      var t=audioCtx.currentTime;
      [880,1320].forEach(function(f,i){
        var o=audioCtx.createOscillator(),g=audioCtx.createGain();
        o.type='sine';o.frequency.value=f;
        o.connect(g);g.connect(audioCtx.destination);
        var st=t+i*0.16;
        g.gain.setValueAtTime(0.0001,st);
        g.gain.exponentialRampToValueAtTime(0.5,st+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,st+0.18);
        o.start(st);o.stop(st+0.2);
      });
    }catch(e){}
  }
  function notify(o){
    if(!('Notification' in window) || Notification.permission!=='granted')return;
    try{
      var body=(o.items||[]).map(function(it){return it.qty+'× '+it.name+(it.detail?' '+it.detail:'');}).join(', ');
      var n=new Notification('Nouvelle commande '+o.numero+' · borne '+o.borneId,{body:body+'  —  '+eur(o.total),tag:'cmd-'+o.id});
      setTimeout(function(){try{n.close();}catch(e){}},8000);
    }catch(e){}
  }
  document.getElementById('act-btn').addEventListener('click',function(){
    try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended')audioCtx.resume(); soundOn=true; }catch(e){}
    if('Notification' in window && Notification.permission!=='granted'){ Notification.requestPermission(); }
    document.getElementById('banner').style.display='none';
    beep();
    this.textContent='🔔 Alertes activées';
  });

  // ---- Rendu ----
  function cardHtml(o){
    var items=(o.items||[]).map(function(it){return '<div class="it"><span class="q">'+(it.qty||1)+'×</span><span>'+esc(it.name)+(it.detail?' <span class="d">'+esc(it.detail)+'</span>':'')+'</span></div>';}).join('');
    var who=o.customerRef?'<div class="who">Client : '+esc(o.customerRef)+'</div>':'';
    var act='';
    if(o.status==='nouveau') act='<button class="act new" data-id="'+o.id+'" data-next="preparation">Préparer →</button>';
    else if(o.status==='preparation') act='<button class="act prep" data-id="'+o.id+'" data-next="prete">Prête →</button>';
    else if(o.status==='prete') act='<button class="act done" data-id="'+o.id+'" data-next="servie">Remise client ✓</button>';
    return '<div class="card'+(flashIds[o.id]?' flash':'')+'" id="card-'+o.id+'">'+
      '<div class="card-top"><div class="num">'+esc(o.numero)+'</div><div class="meta">borne <span class="borne">'+esc(o.borneId)+'</span><br>'+ago(o.ts)+'</div></div>'+
      '<div class="items">'+items+'</div>'+
      '<div class="card-foot"><div><div class="tot">'+eur(o.total)+'</div>'+who+'</div>'+act+'</div>'+
    '</div>';
  }
  function renderAll(){
    var cols={nouveau:[],preparation:[],prete:[]};
    Object.keys(ordersMap).map(function(k){return ordersMap[k];})
      .filter(function(o){return o.status!=='servie';})
      .sort(function(a,b){return a.ts-b.ts;})
      .forEach(function(o){ if(cols[o.status])cols[o.status].push(o); });
    ['nouveau','preparation','prete'].forEach(function(st){
      var box=document.getElementById('col-'+st);
      box.innerHTML=cols[st].length?cols[st].map(cardHtml).join(''):'<div class="empty">Aucune commande</div>';
    });
    document.getElementById('c-new').textContent=cols.nouveau.length;
    document.getElementById('c-prep').textContent=cols.preparation.length;
    document.getElementById('c-done').textContent=cols.prete.length;
    document.getElementById('pend').textContent=cols.nouveau.length;
    document.title=(cols.nouveau.length?'('+cols.nouveau.length+') ':'')+'Centre de commande — KINGSTON';
  }

  // ---- Actions statut ----
  document.body.addEventListener('click',function(ev){
    var b=ev.target.closest('.act'); if(!b)return;
    var id=parseInt(b.getAttribute('data-id'),10), next=b.getAttribute('data-next');
    b.disabled=true;
    fetch('/api/orders/'+id+'/status',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({status:next})})
      .then(function(r){return r.json();})
      .then(function(o){ if(o&&o.id){ if(o.status==='servie')delete ordersMap[o.id]; else ordersMap[o.id]=o; renderAll(); } })
      .catch(function(){ b.disabled=false; });
  });

  // ---- Flux temps réel (SSE) ----
  var live=document.getElementById('live'), livetxt=document.getElementById('livetxt');
  function setLive(on){ live.className='dot '+(on?'on':'off'); livetxt.textContent=on?'En direct':'Reconnexion…'; }
  function connect(){
    var es=new EventSource('/api/orders/stream?boutique='+encodeURIComponent(BOUTIQUE));
    es.addEventListener('snapshot',function(e){ try{ JSON.parse(e.data).forEach(function(o){ordersMap[o.id]=o;}); renderAll(); }catch(x){} });
    es.addEventListener('order',function(e){ try{ var o=JSON.parse(e.data); ordersMap[o.id]=o; flashIds[o.id]=1; setTimeout(function(){delete flashIds[o.id];},3500); beep(); notify(o); renderAll(); }catch(x){} });
    es.addEventListener('update',function(e){ try{ var o=JSON.parse(e.data); if(o.status==='servie')delete ordersMap[o.id]; else ordersMap[o.id]=o; renderAll(); }catch(x){} });
    es.onopen=function(){ setLive(true); };
    es.onerror=function(){ setLive(false); };
  }
  connect();
  setInterval(renderAll, 15000); // rafraichit les "il y a X min"
})();
</script>
</body>
</html>
